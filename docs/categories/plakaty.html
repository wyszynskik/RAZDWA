<div class="category-view">
    <div class="view-header">
        <h2>Plakaty wielkoformatowe A3-A0+</h2>
    </div>

    <div class="calculator-form card">
        <div style="padding:12px; border:1px solid rgba(255,255,255,0.08);">
            <h3 style="margin:0 0 10px 0; font-size:16px;">Wielkoformatowe (A3-A0)</h3>
            <div class="form-group">
                <label for="p-material">Papier / Materiał:</label>
                <select id="p-material" class="form-control">
                    <!-- populated by JS -->
                </select>
                <div id="p-material-hint" class="ghost-hint"></div>
            </div>

            <div id="p-format-group" class="form-group">
                <label for="p-format">Format:</label>
                <select id="p-format" class="form-control">
                    <!-- populated by JS -->
                </select>
                <div id="p-length-group" style="margin-top:10px; display:none;">
                    <label for="p-length-mm" id="p-length-label">Długość (mm):</label>
                    <input type="number" id="p-length-mm" class="form-control" placeholder="np. 420" min="1" step="1" inputmode="numeric" autocomplete="off">
                    <div class="hint">Możesz wpisać własną długość drugiego boku w mm (opcjonalnie).</div>
                </div>
                <label for="p-qty">Ilość (szt):</label>
                <input type="number" id="p-qty" class="form-control" placeholder="np. 10" min="1" step="1" inputmode="numeric" autocomplete="off">
                <div id="p-qty-hint" class="ghost-hint"></div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="p-trim-2" style="display:flex; align-items:center; gap:8px; font-size:14px;">
                    <input type="checkbox" id="p-trim-2">
                    <span>2 cięcia trymer (+1,00 zł)</span>
                </label>
                <div id="p-trim-2-qty-group" style="margin-top: 4px; display: none;">
                    <label for="p-trim-2-qty" style="font-size: 12px; color: #888;">Ilość sztuk:</label>
                    <input type="number" id="p-trim-2-qty" class="form-control" placeholder="np. 5" min="1" step="1" inputmode="numeric" autocomplete="off" style="width: 80px; margin-left: 8px;">
                </div>
            </div>
            <div class="form-group" style="margin-top: 4px;">
                <label for="p-trim-4" style="display:flex; align-items:center; gap:8px; font-size:14px;">
                    <input type="checkbox" id="p-trim-4">
                    <span>4 cięcia trymer (+2,00 zł)</span>
                </label>
                <div id="p-trim-4-qty-group" style="margin-top: 4px; display: none;">
                    <label for="p-trim-4-qty" style="font-size: 12px; color: #888;">Ilość sztuk:</label>
                    <input type="number" id="p-trim-4-qty" class="form-control" placeholder="np. 5" min="1" step="1" inputmode="numeric" autocomplete="off" style="width: 80px; margin-left: 8px;">
                </div>
            </div>

        <div class="form-actions" style="margin-top: 12px;">
            <button id="p-add-to-cart" class="btn-success is-disabled" aria-disabled="true">DODAJ DO KOSZYKA</button>
        </div>
    </div>

    <div id="p-result-display" class="result-display card" style="display:none">
        <div class="result-row total">
            <span>SUMA ZA WSZYSTKO:</span>
            <span id="p-total-price" class="price-value">-</span>
        </div>
        <hr>
        <div class="result-row">
            <span id="p-qty-label">Ilość:</span>
            <span id="p-qty-val" class="price-unit">-</span>
        </div>
        <div id="p-calc-hint" style="display:none; font-size:12px; color:#93c5fd; margin: 4px 0 8px 0; line-height:1.7; background:rgba(59,130,246,0.07); border:1px solid rgba(59,130,246,0.18); border-radius:8px; padding:8px 12px;"></div>
        <div class="result-row">
            <span>Cena jednostkowa:</span>
            <span id="p-unit-price" class="price-unit">-</span>
        </div>
        <div id="p-discount-row" class="result-row" style="display:none; color:#e67e22;">
            <span id="p-discount-label">Rabat ilościowy:</span>
            <span id="p-discount-val" class="price-unit">-</span>
        </div>
        <div id="p-express-hint" class="express-hint" style="display: none;">
            W tym dopłata EXPRESS +20%
        </div>
    </div>

    <div id="p-breakdown-display" class="card" style="display: none; margin-top: 16px;">
        <h3 style="margin: 0 0 12px 0; font-size: 16px;">Jak liczona jest cena</h3>
        <div id="p-breakdown-lines" style="display: grid; gap: 8px; font-size: 14px; line-height: 1.45; color:#334155;"></div>
    </div>
</div>
