       aria-label="Strefa przesyłania plików – kliknij lub przeciągnij pliki">
    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"
         style="margin-bottom:12px;opacity:0.6" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
    </svg>
    <h3>Przeciągnij pliki tutaj</h3>
    <p>lub kliknij, aby wybrać (wiele plików naraz, max 50)</p>
    <input type="file" id="cadFileInput" multiple style="display:none"
           aria-label="Wybierz pliki CAD" />
  </div>

  <!-- Usługi dodatkowe (nie per-plik) -->
  <div class="cad-options-bar cad-extra-services cad-options">
    <div class="cad-extra-service-col">
      <label class="cad-extra-service-item">
        <input type="checkbox" id="optKlientSkladanie">
        <span>Składanie od klienta (4,00 zł/szt)</span>
      </label>
      <span id="cad-upload-klient-skladanie-qty-row" class="cad-extra-qty-row" style="display:none">
        Ilość:
        <input type="number" id="cadUploadKlientSkladanieQty" class="cad-extra-qty-input" min="1" placeholder="szt">
        <button type="button" id="cadUploadKlientSkladanieAdd" class="cad-extra-add-btn" aria-label="Dodaj składanie od klienta">+</button>
      </span>
      <div id="cad-upload-klient-skladanie-price" class="cad-extra-price-line"></div>
    </div>

    <div class="cad-extra-service-col">
      <label class="cad-extra-service-item">
        <input type="checkbox" id="optNieformatoweSkladanie">
        <span>Składanie nieformatowych (2,50 zł/m²)</span>
      </label>
      <span id="cad-upload-nieformatowe-skladanie-qty-row" class="cad-extra-qty-row" style="display:none">
        Ilość:
        <input type="number" id="cadUploadNieformatoweSkladanieQty" class="cad-extra-qty-input" min="0.01" step="0.01" placeholder="m²">
        <button type="button" id="cadUploadNieformatoweSkladanieAdd" class="cad-extra-add-btn" aria-label="Dodaj składanie nieformatowych">+</button>
      </span>
      <div id="cad-upload-nieformatowe-skladanie-price" class="cad-extra-price-line"></div>
    </div>

    <div class="cad-extra-service-col">
      <label class="cad-extra-service-item">
        <input type="checkbox" id="optPaskiWzmacniajace">
        <span>Doklejanie pasków wzmacniających (0,80 zł/szt)</span>
      </label>
      <span id="cad-upload-paski-wzmacniajace-qty-row" class="cad-extra-qty-row" style="display:none">
        Ilość:
        <input type="number" id="cadUploadPaskiWzmacniajaceQty" class="cad-extra-qty-input" min="1" placeholder="szt">
        <button type="button" id="cadUploadPaskiWzmacniajaceAdd" class="cad-extra-add-btn" aria-label="Dodaj paski wzmacniające">+</button>
      </span>
      <div id="cad-upload-paski-wzmacniajace-price" class="cad-extra-price-line"></div>
    </div>
  </div>

  <div id="cadWarning" class="cad-warning" role="alert" style="display:none">
    ⚠️ Dodano ponad 50 plików – sprawdź listę przed wyceną.
  </div>

  <div id="cadUploadStatus" class="cad-warning" role="status" style="display:none"></div>
  
  <!-- ✅ GŁÓWNY EKRAN: Tabela wyników (u góry) -->
  <div id="results-container" class="results-table-container" style="display:none;">
    <table id="resultsTable" class="results-table cad-legend-table" aria-live="polite" aria-label="Wyniki analizy plików (PDF + obrazy)">
      <thead>
        <tr>
          <th class="col-lp" style="width:35px;min-width:35px;">NR.</th>
          <th class="col-name" style="width:20%;min-width:93px;">Nazwa</th>
          <th class="col-size" style="width:20%;min-width:85px;">Rozmiar</th>
          <th class="col-fold" style="width:9%;min-width:55px;">
            <div class="header-toggle">
              <span>Składanie</span>
              <input type="checkbox" id="foldAllCheck" aria-label="Zaznacz składanie dla wszystkich plików" title="Zaznacz wszystkie: składanie">
            </div>
          </th>
          <th class="col-scan" style="width:6%;min-width:42px;">
            <div class="header-toggle">
              <span>Skan</span>
              <input type="checkbox" id="scanAllCheck" aria-label="Zaznacz skanowanie dla wszystkich plików" title="Zaznacz wszystkie: skanowanie">
            </div>
          </th>
          <th class="col-qty" style="width:9%;min-width:42px;">Ilość</th>
          <th class="col-price" style="width:23%;min-width:100px;">
            <div class="cad-price-header">
              <span>Rodzaj</span>
              <span>Cena</span>
            </div>
          </th>
          <th class="col-remove" style="width:6%;min-width:34px;"></th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>

    <div class="cad-summary-section">
      <div id="summaryGrid" style="padding: 16px; background: var(--surface-alt); border-top: 1px solid var(--border);"></div>
      <div class="cad-price-options" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--surface-alt); border-top: 1px solid var(--border);">
        <button type="button" id="selectColor" class="btn-primary" style="display:none;">
          🎨 DODAJ DO KOSZYKA - Kolor: <strong id="selectColorPrice">0,00 zł</strong>
        </button>
        <button type="button" id="selectBw" class="btn-primary" style="display:none;">
          ⚫ DODAJ DO KOSZYKA - CZ-B: <strong id="selectBwPrice">0,00 zł</strong>
        </button>
      </div>
    </div>
  </div>

  <!-- Ekran obliczeń -->
  <div id="ekranObliczen" class="calc-explanation-area">
    <div id="obliczeniaLista"></div>
  </div>
</div>
