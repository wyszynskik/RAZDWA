<div class="category-view">
  <h3>Roll-up Jednostronny</h3>

  <div class="form-group">
    <label for="rollUpType">Rodzaj:</label>
    <select id="rollUpType">
      <option value="" disabled selected>— wybierz rodzaj —</option>
      <option value="full">Roll-up Komplet (z kasetą)</option>
      <option value="replacement">Wymiana wkładu (klienta kaseta)</option>
    </select>
    <div id="rollUpType-hint" class="ghost-hint"></div>
  </div>

  <div class="form-group">
    <label for="rollUpFormat">Format:</label>
    <select id="rollUpFormat">
      <option value="" disabled selected>— wybierz format —</option>
    </select>
    <div id="rollUpFormat-hint" class="ghost-hint"></div>
  </div>

  <div class="form-group">
    <label for="rollUpQty">Ilość (szt):</label>
    <input type="number" id="rollUpQty" min="1" step="1" placeholder="ilość" inputmode="numeric">
    <div id="rollUpQty-hint" class="ghost-hint"></div>
  </div>

  <div class="form-actions">
    <button id="addToCartBtn" class="btn-success is-disabled" aria-disabled="true">DODAJ DO KOSZYKA</button>
  </div>

  <div id="rollUpResult" class="result-area" style="display:none; margin-top: 20px;">
    <div class="price-line highlight">SUMA ZA WSZYSTKO: <span id="resTotalPrice">0.00</span></div>
    <div class="price-line">Cena za szt: <span id="resUnitPrice">0.00</span></div>
  </div>

  <div id="rollUpBreakdown" class="card" style="display: none; margin-top: 16px; overflow: visible;">
    <h3 style="margin: 0 0 12px 0; font-size: 16px;">Jak liczona jest cena</h3>
  </div>

  <div class="cennik-table pricing-legend" style="margin-top: 16px;">
    <div class="legend-head">
      <div>
        <h4>CENNIK ROLL-UP JEDNOSTRONNY</h4>
        <p class="legend-subtitle">Cennik dla kompletu oraz wymiany wkładu.</p>
      </div>
    </div>

    <table>
      <thead>
        <tr id="rollup-legend-header"></tr>
      </thead>
      <tbody id="rollup-legend-body"></tbody>
    </table>

    <p class="cennik-note" id="rollup-legend-note">* Wymiana wkładu: 50,00 zł + 80,00 zł/m² wydruku (blockout z czarnym środkiem).</p>
  </div>
</div>
